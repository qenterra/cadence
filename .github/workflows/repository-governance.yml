name: Repository governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-governance:
    name: repository-governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check text diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...HEAD"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
          else
            git diff --check "$BEFORE_SHA..HEAD"
          fi
      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/qenterra_repository_check.py commit-message --message "$PR_TITLE" --format markdown
      - name: Validate internal pull-request branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: python3 scripts/qenterra_repository_check.py branch --value "$PR_BRANCH" --format markdown
      - name: Audit repository contract and templates
        run: python3 scripts/qenterra_repository_check.py audit --root . --format markdown --output "$RUNNER_TEMP/repository-governance-report.md"
      - name: Preserve governance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-governance-report
          path: ${{ runner.temp }}/repository-governance-report.md
          if-no-files-found: error
          retention-days: 14

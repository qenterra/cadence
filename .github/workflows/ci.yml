name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install developer tools
        run: brew install xcodegen swiftformat swiftlint xcbeautify
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Generate and lint
        env:
          # GitHub's macOS 26 image currently ships Xcode 26.6. Cadence requires
          # Xcode 27, so the complete build and test gate remains local until
          # the hosted image provides a compatible toolchain.
          CADENCE_SKIP_XCODEBUILD: "1"
        run: bash scripts/verify.sh

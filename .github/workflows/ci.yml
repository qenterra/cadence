name: Hosted partial checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Lint and release contracts — Xcode 27 gate unavailable
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install developer tools
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen swiftformat swiftlint xcbeautify python@3.14
      - name: Prepare deterministic release image tools
        run: bash scripts/prepare_python_tools.sh
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Run partial hosted checks (no Xcode build/test gate)
        env:
          # GitHub's macOS 26 image currently ships Xcode 26.6. Cadence requires
          # Xcode 27, so the complete build and test gate remains local until
          # the hosted image provides a compatible toolchain.
          CADENCE_SKIP_XCODEBUILD: "1"
        run: bash scripts/verify.sh

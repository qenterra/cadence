# Generated notes are a draft; edit against CHANGELOG.md before publication.
changelog:
  exclude:
    labels:
      - 'release: skip-notes'
  categories:
    - title: Added
      labels: ['type: feature']
    - title: Changed
      labels: ['type: performance', 'type: refactor', 'type: dependency', 'type: documentation']
    - title: Deprecated
      labels: ['type: deprecation']
    - title: Removed
      labels: ['type: removal']
    - title: Fixed
      labels: ['type: bug']
    - title: Security
      labels: ['type: security']
    - title: Other changes
      labels: ['*']

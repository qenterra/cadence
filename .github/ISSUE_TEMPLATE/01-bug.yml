name: Bug report
description: Report a reproducible defect in Cadence.
title: "fix: "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Remove credentials, personal data, private paths, copyrighted fixtures, and unrelated logs. Report vulnerabilities privately through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "1.0.0 or a full commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Mac model and architecture, audio output route, and file format when relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest numbered sequence and a synthetic fixture when needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe supporting evidence
      description: Sanitized logs, screenshots, recordings, or sample code. Do not attach secrets or private user content.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: This report contains no security vulnerability or private data.
          required: true

name: Cadence

options:
  bundleIdPrefix: com.qenterra
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  QenTerraDesignTokens:
    path: ../design-system/packages/swift
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.10.0

targets:
  Cadence:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/Cadence
      - path: icon/Cadence.icon
    dependencies:
      - package: QenTerraDesignTokens
      - package: GRDB
    info:
      path: Sources/Cadence/Resources/Info.plist
      properties:
        CFBundleDisplayName: Cadence
        CFBundleIconFile: Cadence
        CFBundleIconName: Cadence
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Copyright © 2026 Nikita Melnychenko (QenTerra)
        UTExportedTypeDeclarations:
          - UTTypeConformsTo:
              - com.apple.package
            UTTypeDescription: Cadence Library
            UTTypeIdentifier: com.qenterra.cadence.library
            UTTypeTagSpecification:
              public.filename-extension:
                - library
    entitlements:
      path: Sources/Cadence/Resources/Cadence.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.assets.music.read-write: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qenterra.cadence
        PRODUCT_NAME: Cadence
        INFOPLIST_KEY_CFBundleDisplayName: Cadence
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: Cadence
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - CadenceTests

  CadenceTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/CadenceTests
    dependencies:
      - target: Cadence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

name: Cadence

options:
  bundleIdPrefix: com.qenterra
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Cadence:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/Cadence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qenterra.cadence
        PRODUCT_NAME: Cadence
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cadence
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - CadenceTests

  CadenceTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests/CadenceTests
    dependencies:
      - target: Cadence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

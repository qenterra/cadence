name: Cadence

options:
  bundleIdPrefix: com.qenterra
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    CADENCE_SOURCE_GIT_SHA: UNATTESTED
    CADENCE_RELEASE_TAG: UNTAGGED
    CADENCE_FULL_GATE_ATTESTATION_SHA256: UNATTESTED

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS.git
    exactVersion: 3.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.6

targets:
  Cadence:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/Cadence
        excludes:
          - Features/Rhythm/CadenceModeGradientShader.metal.txt
      - path: Sources/Cadence/Features/Rhythm/CadenceModeGradientShader.metal.txt
        buildPhase: resources
      - path: icon/Cadence.icon
    dependencies:
      - package: GRDB
      - package: AppAuth
      - package: Sparkle
    info:
      path: Sources/Cadence/Resources/Info.plist
      properties:
        CFBundleDisplayName: Cadence
        CFBundleDocumentTypes:
          - CFBundleTypeExtensions:
              - aac
              - aif
              - aiff
              - flac
              - m4a
              - mp3
              - wav
            CFBundleTypeName: Supported Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
        CFBundleIconFile: Cadence
        CFBundleIconName: Cadence
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CadenceSourceGitSHA: $(CADENCE_SOURCE_GIT_SHA)
        CadenceReleaseTag: $(CADENCE_RELEASE_TAG)
        CadenceFullGateAttestationSHA256: $(CADENCE_FULL_GATE_ATTESTATION_SHA256)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.qenterra.cadence
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Copyright © 2026 Nikita Melnychenko (QenTerra)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUEnableInstallerLauncherService: true
        SUFeedURL: https://raw.githubusercontent.com/QenTerra/cadence/main/appcast.xml
        SUPublicEDKey: 7/3AjNwmfbQhlvGOgMuXxlu2cWV/pb009DPVu6AuSN0=
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qenterra.cadence
        PRODUCT_NAME: Cadence
        INFOPLIST_KEY_CFBundleDisplayName: Cadence
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: Cadence
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/Cadence/Resources/CadenceDebug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/Cadence/Resources/Cadence.entitlements
    scheme:
      testTargets:
        - CadenceTests

  CadenceTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/CadenceTests
    dependencies:
      - target: Cadence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

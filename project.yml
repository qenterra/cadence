name: Cadence

options:
  bundleIdPrefix: com.qenterra
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Cadence:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/Cadence
    info:
      path: Sources/Cadence/Resources/Info.plist
      properties:
        CFBundleDisplayName: Cadence
        LSApplicationCategoryType: public.app-category.music
        UTExportedTypeDeclarations:
          - UTTypeConformsTo:
              - com.apple.package
            UTTypeDescription: Cadence Library
            UTTypeIdentifier: com.qenterra.cadence.library
            UTTypeTagSpecification:
              public.filename-extension:
                - library
    entitlements:
      path: Sources/Cadence/Resources/Cadence.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.assets.music.read-write: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qenterra.cadence
        PRODUCT_NAME: Cadence
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - CadenceTests

  CadenceTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/CadenceTests
    dependencies:
      - target: Cadence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
